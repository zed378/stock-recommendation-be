# Turns the presence of an Upgrade header into the right Connection header.
#
# At this level rather than inside `server` because `map` is an http-context
# directive, and this file is included from inside `http`. A hardcoded
# "Connection: upgrade" would be wrong for every ordinary request that happens
# to pass through the same location.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The event socket, before the general /api rule so it matches first.
    #
    # Its own block because the settings a WebSocket needs are the opposite of
    # the ones a request needs: the Upgrade handshake has to be forwarded
    # verbatim, and the read timeout has to outlast a connection that is
    # *supposed* to sit idle. Under the /api rule its 300s read timeout would
    # drop a healthy socket every five minutes.
    location /api/ws/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $ws_upstream api;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$ws_upstream:8000;

        proxy_http_version 1.1;
        # Both required, and `$connection_upgrade` rather than a literal
        # "upgrade": a non-upgrade request through this path must not be told
        # to upgrade.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # A day. The socket sends a heartbeat every 25 seconds, so a silence
        # longer than this is a connection that has genuinely gone.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # The API is proxied under the same origin the app is served from. That is
    # not only convenience: it removes CORS entirely, and it means the bearer
    # token never travels to a second origin.
    location /api/ {
        # The upstream is reached through a *variable*, and that is load-bearing.
        #
        # With a literal hostname, nginx resolves it once while loading the
        # config and refuses to start if it cannot. One crashed API container
        # then takes the dashboard down with it: nothing serves at all, and the
        # edge reports 502 for the whole site rather than for the API. That is
        # exactly how this was found.
        #
        # A variable defers resolution to request time, so nginx always starts,
        # static assets always serve, and only /api fails while the backend is
        # down. 127.0.0.11 is Docker's embedded DNS; the short TTL means a
        # restarted container is picked up rather than cached forever.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_upstream api;

        # Replaces what the trailing slash on a literal proxy_pass used to do:
        # strip the /api prefix before forwarding.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream:8000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An analysis run calls several agents in sequence and legitimately
        # takes minutes. The default 60s would cut it off and report a gateway
        # timeout for work that was going to succeed.
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        # Nothing behind /api may be cached: every response is either
        # per-user or a point-in-time market figure.
        proxy_buffering off;
        add_header Cache-Control "no-store" always;

        # A JSON body for a dead backend, so a fetch() gets something it can
        # parse and report rather than nginx's HTML error page, which arrives
        # at the client as a JSON parse failure and hides the real cause.
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_down;
    }

    location @api_down {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"detail":"The API is not reachable. Check that the api container is running: docker compose ps"}';
    }

    # Hashed filenames, so these can be cached indefinitely - a new build
    # produces new names rather than new contents under the same name.
    #
    # `/static/`, not Vite's default `/assets/`: the application has a route at
    # /assets/:ticker, and this block matched it before the SPA fallback could.
    # `try_files $uri =404` then answered 404 for every refresh on an asset
    # page. The build output is renamed in vite.config.ts so the two namespaces
    # cannot overlap at all.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html itself must never be cached, or a browser keeps serving the
    # old one and requests asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Client-side routing: an unknown path is a route, not a missing file.
    # /static/ is matched above and 404s properly, so a genuinely missing
    # bundle file does not silently return HTML while /assets/BBCA - a real
    # application route - reaches the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Modest hardening. A stricter CSP belongs here once the deployment's own
    # origins are known; these are the headers that are correct regardless.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
