<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -150 300 300" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="brand" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" /> <!-- Indigo -->
      <stop offset="50%" stop-color="#8b5cf6" /> <!-- Violet -->
      <stop offset="100%" stop-color="#10b981" /> <!-- Emerald -->
    </linearGradient>

    <linearGradient id="brand-dim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagon Network Structure -->
  <g stroke="url(#brand-dim)" stroke-width="4" fill="none">
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" />
    <!-- Inner Connections -->
    <path d="M0,-120 L0,120 M-104,-60 L104,60 M-104,60 L104,-60" />
    <circle cx="0" cy="0" r="104" stroke-width="2" stroke-dasharray="8 8" />
  </g>

  <!-- Nodes (Dots) -->
  <g fill="#8b5cf6">
    <circle cx="0" cy="-120" r="6" />
    <circle cx="104" cy="-60" r="6" />
    <circle cx="104" cy="60" r="6" />
    <circle cx="0" cy="120" r="6" />
    <circle cx="-104" cy="60" r="6" />
    <circle cx="-104" cy="-60" r="6" />
    <circle cx="0" cy="0" r="8" fill="#10b981" filter="url(#glow)"/>
  </g>

  <!-- Bold Uptrend Line & Arrow -->
  <g>
    <path d="M -120,60 L -60,0 L -20,30 L 40,-40 L 80,0 L 140,-90" 
          fill="none" 
          stroke="url(#brand)" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)" />
    
    <!-- Arrow Head -->
    <path d="M 100,-90 L 140,-90 L 140,-50" 
          fill="none" 
          stroke="#10b981" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)" />
  </g>
</svg>
