<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Brand Gradient -->
    <linearGradient id="brand" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" /> <!-- Indigo -->
      <stop offset="50%" stop-color="#8b5cf6" /> <!-- Violet -->
      <stop offset="100%" stop-color="#10b981" /> <!-- Emerald -->
    </linearGradient>

    <linearGradient id="brand-dim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" fill="url(#bg)" rx="100" />

  <!-- Inner Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="2">
    <path d="M128,0 V512 M256,0 V512 M384,0 V512" />
    <path d="M0,128 H512 M0,256 H512 M0,384 H512" />
  </g>

  <!-- Hexagon Network Structure -->
  <g transform="translate(256, 236)" stroke="url(#brand-dim)" stroke-width="4" fill="none">
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" />
    <!-- Inner Connections -->
    <path d="M0,-120 L0,120 M-104,-60 L104,60 M-104,60 L104,-60" />
    <circle cx="0" cy="0" r="104" stroke-width="2" stroke-dasharray="8 8" />
  </g>

  <!-- Nodes (Dots) -->
  <g transform="translate(256, 236)" fill="#8b5cf6">
    <circle cx="0" cy="-120" r="6" />
    <circle cx="104" cy="-60" r="6" />
    <circle cx="104" cy="60" r="6" />
    <circle cx="0" cy="120" r="6" />
    <circle cx="-104" cy="60" r="6" />
    <circle cx="-104" cy="-60" r="6" />
    <circle cx="0" cy="0" r="8" fill="#10b981" filter="url(#glow)"/>
  </g>

  <!-- Bold Uptrend Line & Arrow -->
  <g transform="translate(256, 236)">
    <path d="M -120,60 L -60,0 L -20,30 L 40,-40 L 80,0 L 140,-90" 
          fill="none" 
          stroke="url(#brand)" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)" />
    
    <!-- Arrow Head -->
    <path d="M 100,-90 L 140,-90 L 140,-50" 
          fill="none" 
          stroke="#10b981" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)" />
  </g>

  <!-- Text / Typography -->
  <g text-anchor="middle">
    <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="42" fill="#f8fafc" letter-spacing="4">AIDSS</text>
    <text x="256" y="454" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="14" fill="#94a3b8" letter-spacing="6">AI INVESTMENT SUPPORT</text>
  </g>
</svg>
