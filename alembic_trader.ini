[alembic]
script_location = alembic_trader
# The URL comes from AIDSS_TRADER_MIGRATION_DATABASE_URL (role trader_owner), never from this file.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
