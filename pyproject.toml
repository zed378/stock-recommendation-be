[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidss"
version = "0.1.0"
description = "AI Investment Decision Support Platform - decision support only, no order execution"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "SQLAlchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "bcrypt>=4.1",
    "PyJWT>=2.8",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "croniter>=2.0",
    # Windows ships no IANA database, and the Alpha Vantage adapter reads the
    # exchange time zone out of each response to place intraday bars. Declared
    # explicitly rather than leaned on as a transitive dependency of pandas.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:aidss.*"]
# Network and PostgreSQL tests are opt-in, for different reasons. Network tests
# depend on a third party's uptime; PostgreSQL tests need a running database.
# Neither should make `pytest` fail on a laptop with neither available.
#
#   pytest              # the hermetic suite, SQLite only
#   pytest -m postgres  # dialect behaviour SQLite cannot show
#   pytest -m network   # does the unofficial endpoint still behave?
addopts = "-m 'not network and not postgres'"
markers = [
    "network: hits a live external endpoint; deselected by default",
    "postgres: needs a real PostgreSQL with pgvector; deselected by default",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Migration bodies are written by `alembic revision --autogenerate`, so
# reformatting them by hand would only be undone by the next generated file.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is expressed as call-in-default-argument by
# design, so B008 would flag every endpoint signature in the project.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    # Our own dependency factory, used the same way as fastapi.Depends.
    "aidss.api.deps.require_permission",
]
