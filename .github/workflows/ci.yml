name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  architecture-guard:
    name: Architecture Constraints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify architecture constraint tests are unmodified
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- tests/test_architecture_constraints.py)"
          if [ -n "$changed" ]; then
            echo "ERROR: tests/test_architecture_constraints.py must not be modified in a PR."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-trader.lock

      - name: Install Trader runtime and pytest
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --no-deps -r requirements-trader.lock
          pip install pytest

      - name: Run architecture constraint tests
        run: pytest tests/test_architecture_constraints.py -q

  trader-backend:
    name: Trader Backend (Lint & Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-trader.lock

      - name: Install Trader dependencies and test tools
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --no-deps -r requirements-trader.lock
          pip install pytest ruff

      - name: Lint with ruff
        run: ruff check src tests alembic_trader deploy

      - name: Run Trader and routing tests
        run: pytest tests/trader tests/test_frontend_routing.py -q

  frontend:
    name: Frontend (Typecheck, Lint, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: ./node_modules/.bin/tsc -b --noEmit

      - name: Lint
        run: npx oxlint .

      - name: Unit tests
        run: npx vitest run --pool=vmThreads

      - name: Production build
        run: npm run build
