# Local development stack (Section 14, Development environment).
#
# Deliberately minimal for Phases 1-3: PostgreSQL (with pgvector, so the
# Phase 7 schema applies cleanly today) plus the API. Redis, the job queue,
# and the vector database land with Phases 4-7.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aidss
      POSTGRES_PASSWORD: aidss
      POSTGRES_DB: aidss
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidss -d aidss"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIDSS_DATABASE_URL: postgresql+psycopg://aidss:aidss@postgres:5432/aidss
      AIDSS_ENVIRONMENT: development
      # Yahoo: free, no API key, real IDX coverage - and unofficial, which is
      # an accepted trade-off recorded in .env.example. Switch to `fixture`
      # for offline or deterministic runs.
      AIDSS_MARKET_DATA_PROVIDER: yahoo
      AIDSS_YAHOO_SYMBOL_SUFFIX: .JK
      AIDSS_NEWS_PROVIDER: fixture
      AIDSS_AI_PROVIDER: fixture
      AIDSS_JWT_SECRET: dev-only-change-me
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn aidss.main:app --host 0.0.0.0 --port 8000"

  # The Scheduler -> Job Queue -> Worker Pool of the Section 4 diagram.
  # Separate from the API so a long analysis cannot occupy a request thread,
  # and so workers can be scaled independently of it.
  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      # Waits for the API so migrations have run before a worker touches the
      # tables. Without this, `docker compose up` races on a fresh database.
      api:
        condition: service_started
    environment:
      AIDSS_DATABASE_URL: postgresql+psycopg://aidss:aidss@postgres:5432/aidss
      AIDSS_ENVIRONMENT: development
      AIDSS_MARKET_DATA_PROVIDER: yahoo
      AIDSS_YAHOO_SYMBOL_SUFFIX: .JK
      AIDSS_NEWS_PROVIDER: fixture
      AIDSS_AI_PROVIDER: fixture
      AIDSS_JWT_SECRET: dev-only-change-me
    # Worker and scheduler in one process. Scaling means `--worker` here and
    # exactly one separate `--scheduler` instance: several schedulers would
    # each enqueue for the same due schedule, and only the dedup key would stop
    # the duplicates.
    command: python -m aidss.jobs

  # The investor dashboard: a static bundle behind nginx, which also proxies
  # /api to the service above. One origin, so the browser needs no CORS and the
  # bearer token never leaves it.
  #
  # A separate image rather than static files mounted into the API, so that a
  # mistyped API path still returns a JSON 404 instead of index.html - and so
  # the API image ships no HTML at all.
  frontend:
    build: ./frontend
    depends_on:
      api:
        condition: service_started
    ports:
      - "5173:80"

volumes:
  postgres_data:
